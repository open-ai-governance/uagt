# UAGT Source Manifest
# The pinned version/date of each source framework that the current build reflects.
# Every mapping in data/controls/*.yaml must reference a framework + version listed
# here (enforced in CI by scripts/build_tables.py --check). Bumping a version here is
# a deliberate, changelog-worthy event (see GOVERNANCE.md and section 8.6 of the design).

manifest_version: "0.4.0"
updated: "2026-11-17"

frameworks:
  - id: ISO-IEC-42001
    name: "ISO/IEC 42001:2023 - Artificial intelligence management system"
    version: "2023"
    structure: "Management-system clauses (4-10) + Annex A controls (A.x)"
    issuer: "ISO/IEC"
    obtain_from: "https://www.iso.org/standard/81230.html"
    notes: "Referenced by clause number and Annex A control id only; text not reproduced."

  - id: NIST-AI-RMF
    name: "NIST AI Risk Management Framework 1.0 (NIST AI 100-1)"
    version: "1.0"
    structure: "Functions: GOVERN / MAP / MEASURE / MANAGE, with categories and subcategories"
    issuer: "NIST"
    obtain_from: "https://doi.org/10.6028/NIST.AI.100-1"
    notes: "Subcategory ids used, e.g. MAP-2.3, GOVERN-1.1."

  - id: EU-AI-ACT
    name: "Regulation (EU) 2024/1689 (EU AI Act), as amended by Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    version: "2024/1689 am. 2026/1744"
    structure: "113 articles + 14 annexes, risk-tiered obligations"
    issuer: "European Union"
    obtain_from: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    amendments:
      - name: "Digital Omnibus on AI"
        citation: "Regulation (EU) 2026/1744 of 8 July 2026"
        eli: "http://data.europa.eu/eli/reg/2026/1744/oj"
        status: "Published in the Official Journal; in force 27 July 2026"
        tracked: false
        tracking_doc: "docs/omnibus-tracking.md"
        verified: "2026-09-28 against the official text (EU Publications Office, CELEX 32026R1744)"
        application_dates:
          art5_ncii_csam: "2026-12-02"      # Art.5(1)(ba)-(bb), 5(1a), 5(1b)
          art50_2_legacy_systems: "2026-12-02"  # Art.111(4): systems on the market before 2 Aug 2026
          high_risk_annex_iii: "2027-12-02"   # Chapter III s.1-3, Art.6(2)
          high_risk_annex_i: "2028-08-02"     # Chapter III s.1-3, Art.6(1)
          penalties_arts_102_110: "2026-07-27"
        notes: >
          Mapping effects: Art.4 AI literacy rewritten to a duty to take measures to support it,
          with no guaranteed level (MC-D1-04 full to partial). New Art.4a (special-category data for bias
          detection) replaces deleted Art.10(5) (MC-D3-04 retargeted; added to MC-D3-03). New
          Art.5(1)(ba)-(bb) NCII/CSAM prohibitions (MC-D6-05). Art.49 registration retained
          (Annex VIII section B trimmed). No renumbering of mapped articles.
    notes: "Referenced by Article number only; text not reproduced."

  # ISO/IEC 27001 is an OPTIONAL attached framework (not part of the required three-way
  # coverage). It demonstrates the normalized control layer's extensibility: a new framework
  # maps to the Master Control Set where a genuine equivalent exists, without disturbing the
  # anchor mappings. Coverage is partial/in-progress, concentrated where 27001's ISMS controls
  # apply (security, logging, incidents, suppliers, governance).
  - id: ISO-IEC-27001
    name: "ISO/IEC 27001:2022 - Information security management system (incl. Amd 1:2024)"
    version: "2022/Amd 1:2024"
    structure: "Management-system clauses (4-10) + Annex A: 93 controls in 4 themes (A.5 Organizational, A.6 People, A.7 Physical, A.8 Technological)"
    issuer: "ISO/IEC"
    obtain_from: "https://www.iso.org/standard/27001"
    required: false
    notes: >
      Referenced by Annex A control id only; text not reproduced. Amd 1:2024 adds climate-change
      consideration to clauses 4.1/4.2 only; no Annex A control changed, so mappings are unaffected.

  # SOC 2 (AICPA Trust Services Criteria) - a second OPTIONAL attached framework. Strong on
  # security/governance/operations (Common Criteria), absent on AI-specific concerns.
  - id: SOC-2
    name: "AICPA SOC 2 - Trust Services Criteria (TSC)"
    version: "2017"
    structure: "Common Criteria CC1-CC9 (Security) + Availability (A1), Processing Integrity (PI1), Confidentiality (C1), Privacy (P1-P8)"
    issuer: "AICPA"
    obtain_from: "https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services"
    required: false
    notes: "2017 TSC (with 2022 revised points of focus). Referenced by criterion id only; text not reproduced."

  # COBIT 2019 - broad IT/enterprise-governance framework (OPTIONAL). Maps widely across
  # governance, risk, lifecycle, monitoring, and vendor management.
  - id: COBIT-2019
    name: "COBIT 2019 - Governance and management of enterprise I&T"
    version: "2019"
    structure: "40 governance/management objectives across EDM, APO, BAI, DSS, MEA domains"
    issuer: "ISACA"
    obtain_from: "https://www.isaca.org/resources/cobit"
    required: false
    notes: "Referenced by objective id only; text not reproduced."

  # ISO/IEC 27701 - privacy information management extension to ISO/IEC 27001 (OPTIONAL).
  # Narrow/privacy-focused: maps strongly to privacy and data controls, none elsewhere.
  - id: ISO-IEC-27701
    name: "ISO/IEC 27701:2019 - Privacy information management system (PIMS)"
    version: "2019"
    structure: "Extends ISO/IEC 27001/27002 + PIMS-specific guidance (clause 7 PII controllers, clause 8 PII processors)"
    issuer: "ISO/IEC"
    obtain_from: "https://www.iso.org/standard/71670.html"
    required: false
    superseded_by:
      name: "ISO/IEC 27701:2025 (standalone PIMS; own clauses 4-10 + Annex A controller/processor/shared tables)"
      published: "2025-10"
      status: "Tracked, not yet remapped. The 2019 clause-7 refs remain pinned until they are remapped via the Annex F 2019-to-2025 correspondence."
    notes: "Referenced by clause id only; text not reproduced."

  # Korea AI Basic Act - OPTIONAL attached framework (first non-EU/US statute). Maps strongly
  # on transparency/labelling, human oversight and high-impact risk management; none on
  # data quality, bias, privacy and security, which the Act leaves to other laws.
  - id: KR-AI-BASIC-ACT
    name: "Republic of Korea - Framework Act on the Development of Artificial Intelligence and Establishment of Trust (AI Basic Act)"
    version: "Act No. 20676 am. 21311"
    structure: "Act articles (Ch. IV Arts. 27-36: ethics, transparency, safety, high-impact AI, impact assessment, domestic representative) + Enforcement Decree (Presidential Decree No. 36053, as amended by Nos. 36506 and 36580)"
    issuer: "Republic of Korea (MSIT)"
    obtain_from: "https://www.law.go.kr/LSW/lsInfoR.do?lsiSeq=282791&efYd=20260721&chrClsCd=010202&ancYnChk=0"
    required: false
    in_force: "2026-01-22"
    verified: "2026-09-28 against the Korean consolidated text (law.go.kr)"
    notes: >
      Referenced by Act article/paragraph/item, e.g. Art.34(1)(4). A ref prefixed "Decree" cites the
      Enforcement Decree. Cite the Korean text: the CSET English translation renders Art.31(2) as
      advance notice, whereas the Korean text requires labelling the outputs. MSIT has announced
      a grace period of at least 1 year for fines (Art.43, up to KRW 30M); this is policy, not
      in the statute.

  # Colorado ADMT law - OPTIONAL attached framework (first US state statute). Maps strongly on
  # developer-to-deployer documentation and value-chain handoff, partly on consumer notice,
  # human review and personal-data correction; none on risk management, impact assessment and
  # the duty of care, which SB24-205 had and SB26-189 repealed.
  - id: US-CO-ADMT
    name: "Colorado SB26-189 - Automated Decision-Making Technology in Consequential Decisions (C.R.S. 6-1-1701 to 6-1-1709)"
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    structure: "C.R.S. title 6, article 1, part 17: definitions (1701), developer documentation (1702), deployer records (1703), notices and post-adverse-outcome disclosures (1704), consumer rights (1705), enforcement (1706), liability allocation (1707), exemptions (1708), no new private right of action (1709)"
    issuer: "State of Colorado (General Assembly; enforced by the Attorney General)"
    obtain_from: "https://leg.colorado.gov/bills/sb26-189"
    required: false
    in_force: "2027-01-01"
    verified: "2026-11-16 against the signed act and Session Laws 2026 ch. 131 (leg.colorado.gov)"
    amendments:
      # Implementing rules, tracked the way the EU Digital Omnibus was while pending.
      - name: "Attorney General rules for the ADMT and Chatbot Safety Acts (4 CCR 904-6, proposed)"
        status: >
          Notice of proposed rulemaking 11 Aug 2026; comment period opened 11 Aug 2026; hearing
          set for 26 Oct 2026, continuing as needed. Not adopted as of the verified date. The Act
          requires the 1704(4) and 1705(3) rules on or before 1 Jan 2027.
        tracked: true
        notes: >
          Listed, not mapped. Mappings reflect the statute only; pin once the rules are adopted,
          with a changelog entry. Authority per the notice: C.R.S. 6-1-108(1) and 6-1-1707 (as
          enacted by SB24-205), and 6-1-1704(4), 6-1-1705(3) and 6-1-1706(5) (as amended by
          SB26-189). Source: https://coag.gov/ai/. The rules also implement HB26-1263 (Chatbot
          Safety Act), which is not part of this framework. A federal court order of 27 Apr 2026
          in X.AI LLC v. Weiser (D. Colo.) bars enforcement of SB24-205 or legislation amending
          it until the Attorney General completes rulemaking and the court rules (per the
          Legislative Council final fiscal note of 8 Sep 2026).
    notes: >
      Referenced by C.R.S. section, e.g. C.R.S. 6-1-1704(3). SB26-189 section 1 repealed and
      reenacted part 17, which SB24-205 had created, so the same section numbers carry different
      text: refs here mean the reenacted part, and "former" in a rationale cites SB24-205. Signed
      14 May 2026. The Act takes effect 1 Jan 2027 and applies to consequential decisions made on
      or after that date; 6-1-1704(4), 6-1-1705(3) and 6-1-1706(6) took effect on passage
      (SB26-189 section 5(2)). Enforcement is by the Attorney General only, as a deceptive trade
      practice; there is no private right of action (6-1-1706).

  # China generative-AI regime - OPTIONAL attached framework. One ID for three binding
  # instruments (issue #2), one mapping per control. Strong on synthetic-content labelling;
  # partial on training data, bias and personal information, user information and agreements,
  # accuracy and unlawful content, and weakly on roles, registration, risk assessment,
  # documentation, records, robustness, security, design, monitoring and suppliers; none on AI
  # policy, staff AI literacy, impact assessment, risk tolerance, human oversight, operator
  # competence, testing, continual improvement and model-level governance. 28 mappings:
  # 1 full / 18 partial / 9 none.
  - id: CN-GENAI
    name: "People's Republic of China - Interim Measures for the Management of Generative AI Services, Measures for Labeling AI-Generated Synthetic Content, and GB 45438-2025"
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    structure: "Interim Measures (24 articles in 5 chapters: general provisions, technology development and governance, service norms, supervision and liability, supplementary) + Labeling Measures (14 articles: explicit and implicit labels, platform and app-store duties, user agreements, logs, user declarations) + GB 45438-2025 (mandatory national standard on labelling methods: explicit labels cl.5, implicit labels cl.6, metadata format Annex E)"
    issuer: "People's Republic of China (CAC with other departments for the two Measures; SAMR and SAC for GB 45438-2025)"
    obtain_from: "https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm"
    required: false
    in_force: "2025-09-01"
    verified: "2026-11-17 against the official Chinese texts: the two Measures (cac.gov.cn) and the full text of GB 45438-2025 as posted by TC260 (tc260.org.cn); standards metadata on ndls.org.cn"
    amendments:
      # Pending changes that would touch this regime, tracked like Colorado's AG rules.
      # As of 2026-11-17 no draft amendment to the three mapped instruments was found.
      - name: "Provisions of the State Council on Ensuring Minors' Healthy and Safe Use of the Internet (draft for comment)"
        status: >
          Draft published by CAC for comment 18 Sep 2026; comments closed 17 Oct 2026. Not
          adopted as of the verified date; draft Art.25 gives the year 2026 for entry into
          force and leaves the month and day blank.
        tracked: true
        notes: >
          Listed, not mapped. The draft would require AI services that may affect minors'
          cognition to be offered to under-16s through a minors' mode (draft Art.5(3)). Source:
          https://www.cac.gov.cn/2026-09/18/c_1791482017777471.htm
      - name: "Measures for the Administration of Internet Information Services, revision (draft for comment, second round)"
        status: >
          Second consultation draft published by CAC 3 Jul 2026 (drafted with MIIT and the
          Ministry of Public Security); comments closed 2 Aug 2026. A draft, not in force.
          On the State Council 2026 legislative work plan.
        tracked: true
        notes: >
          Listed, not mapped. Its section on intelligent information services (draft
          Arts.55-64) would restate core GenAI and labelling duties in an administrative
          regulation, add public disclosure of operating mechanisms and training-data sources
          (draft Art.56) and widen the stop-and-report duty to significant security risks
          (draft Art.64). If adopted, re-check MC-D1-03, MC-D2-01, MC-D2-02, MC-D3-01, MC-D3-02,
          MC-D4-01, MC-D4-03, MC-D4-04, MC-D5-01, MC-D6-03, MC-D7-01, MC-D7-02, MC-D8-01 and
          MC-D8-02. Source:
          https://www.cac.gov.cn/2026-07/03/c_1784822399677167.htm
      - name: "Comprehensive national AI legislation"
        status: >
          The State Council 2026 legislative work plan (Guobanfa [2026] No. 14) commits to
          accelerating comprehensive legislation for the healthy development of AI. No draft has
          been published as of the verified date.
        tracked: true
        notes: >
          Listed, not mapped. Source:
          https://www.gov.cn/zhengce/zhengceku/202605/content_7068346.htm
    notes: >
      Mappings are semantic judgements against the official Chinese texts, not translations.
      One mapping per control: the ref cites the best-fit provision and the rationale names
      related ones. Refs and cited provisions start with the instrument's prefix: "GenAI",
      "Labeling" or "GB 45438" (e.g. GenAI Art.7(4), Labeling Art.9, GB 45438 cl.6.1).
      Numbers in parentheses are items (xiang); "para." is a paragraph (kuan); "cl." is a
      clause of the standard.
      GenAI: Interim Measures for the Management of Generative AI Services
      (《生成式人工智能服务管理暂行办法》), a departmental rule issued as CAC
      Order No. 15 by CAC, NDRC, the Ministry of Education, MOST, MIIT, the Ministry of Public
      Security and NRTA; adopted 23 May 2023, signed 10 Jul 2023, published 13 Jul 2023, in
      force 15 Aug 2023 (Art.24). It applies to services offered to the public in mainland
      China (GenAI Art.2 para.1), not to development or use without such a service (GenAI
      Art.2 para.3).
      Labeling: Measures for Labeling AI-Generated Synthetic Content
      (《人工智能生成合成内容标识办法》), issued by notice Guoxinban Tongzi [2025]
      No. 2 of 7 Mar 2025 by CAC, MIIT, the Ministry of Public Security and NRTA; published
      14 Mar 2025, in force 1 Sep 2025 (Art.14);
      https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm. It applies to providers within
      the Algorithmic Recommendation Provisions, the Deep Synthesis Provisions or the Interim
      Measures (Labeling Art.2), with duties also on content-dissemination platforms, app
      stores and users (Labeling Arts.6, 7 and 10).
      GB 45438: GB 45438-2025, Cybersecurity technology - Labeling method for content generated
      by artificial intelligence (《网络安全技术 人工智能生成合成内容标识方法》),
      mandatory national standard issued by SAMR and SAC, administered (guikou) by the Office
      of the Central Cyberspace Affairs Commission; published 28 Feb 2025, in force 1 Sep 2025;
      applies to generation and content-dissemination service providers (GB 45438 cl.1). It
      sets methods for Labeling duties (Labeling Art.11), so it is cited by clause number,
      never as a ref; no standard text is reproduced. Full text as posted by TC260:
      https://www.tc260.org.cn/tc260/tzgg/202503/d547a7044108462b9982228eb2c744ba.shtml;
      record: https://www.ndls.org.cn/standard/detail/2b0a677a2b9c6d7d4dbcadf47730fa33.
      in_force is when the last of the three took effect.
      Parent laws (GenAI Art.1): the Cybersecurity Law (amended with effect from 1 Jan 2026;
      https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm), the Data Security Law, the
      Personal Information Protection Law and the Science and Technology Progress Law. Also
      outside this framework: the Network Data Security Management Regulations (State Council
      Order No. 790), whose Art.19 sets training-data security duties for generative AI
      providers.
      NOT in the mapped set: (1) the Deep Synthesis Provisions; (2) the algorithm filing rules
      of the Algorithmic Recommendation Provisions; (3) the security-assessment rules: the
      Provisions on Security Assessment of Internet Information Services with Public-Opinion
      Attributes or Social-Mobilisation Capacity (published 15 Nov 2018, in force 30 Nov 2018;
      https://www.cac.gov.cn/2018-11/15/c_1123716072.htm), which GenAI Art.17 and Labeling
      Art.12 refer to without naming. (1) and (2) as agreed in issue #2;
      (3) by the same reasoning, for the maintainer to confirm. Rationales mark references to
      them "not mapped". CAC enforcement applies (1) and (3) alongside the mapped instruments
      (typical cases, 15 Sep 2026,
      https://www.cac.gov.cn/2026-09/15/c_1790876152357946.htm). Also not mapped, each left
      for the maintainer to decide: the Interim Measures for the Management of Anthropomorphic AI
      Interactive Services (CAC Order No. 21, in force 15 Jul 2026), for continuous
      emotional-interaction (companion) services; and the Measures for AI Science and
      Technology Ethics Review and Services (Trial) (Gongxinbu Lianke [2026] No. 75, MIIT and
      nine other departments; "the AI ethics review measures"), which require an AI ethics
      committee where research involves ethics-sensitive fields (its Art.9, applying the 2023
      S&T Ethics Review Measures Art.4) and an ethics-risk assessment in ethics review of
      in-scope AI R&D (its Arts.2 and 12); in-scope activities must go to the unit's committee
      or, where the unit has none or its committee is not competent, to a service centre the
      unit has entrusted (its Art.12; centres are set up under its Art.11).

# Companion sources referenced in rationale but not themselves mapped targets. They inform
# specific domains (e.g. ISO/IEC 42005 for D2 impact assessment; the NIST Generative AI
# Profile for D8 GPAI). Mappings still resolve only to the three anchor frameworks above.
companions:
  - id: ISO-IEC-42005
    name: "ISO/IEC 42005:2025 - AI system impact assessment"
    informs: ["d2-risk-impact-assessment"]
  - id: NIST-AI-600-1
    name: "NIST AI 600-1 - Generative AI Profile (2024)"
    informs: ["d8-value-chain-gpai"]
  - id: EN-18286
    name: "EN 18286:2026 - Artificial intelligence - Quality management system for EU AI Act regulatory purposes (CEN-CENELEC JTC 21)"
    published: "2026-07"
    informs: ["d1-accountability-governance"]
    notes: >
      First AI Act standard (supports Art.17 QMS). Not yet cited in the OJ as a harmonised standard,
      so it confers no presumption of conformity yet. Watch for the OJ citation.
  - id: GB-T-45654
    name: "GB/T 45654-2025 - Cybersecurity technology - Basic security requirements for generative artificial intelligence service"
    published: "2025-04-25"
    in_force: "2025-11-01"
    administered_by: "National Cybersecurity Standardization Technical Committee (TC260)"
    informs: ["d2-risk-impact-assessment", "d3-data-governance-quality",
              "d6-robustness-accuracy-security", "d7-lifecycle-monitoring"]
    notes: >
      Recommended (GB/T), not binding, so kept out of CN-GENAI (issue #2) and cited in its
      rationales instead. Could become its own entry if it turns out to carry real weight.
      Issued by SAMR and SAC; administered (guikou) by TC260. Aimed chiefly at services with
      public-opinion attributes or social-mobilisation capacity (its introduction), which ties
      it to GenAI Art.17; Annex B (informative) is a security-assessment reference method. Full
      text as posted by TC260:
      https://www.tc260.org.cn/tc260/xwdt1/202506/739067714b9f40daa20219ea8fd7bf6d.shtml;
      record: https://www.ndls.org.cn/standard/detail/19d53d40666b1c2635e6fb1c3998c1c2.

# The cited methodology this crosswalk implements (paper <-> repo reciprocal citation, FR8).
methodology:
  title: >
    Bridging AI Risk Frameworks: Reconciling ISO/IEC 42001, the NIST AI Risk Management
    Framework, and the EU AI Act into a Unified Governance Taxonomy
  author: "Vinod Dhiman"
  taxonomy: "Unified AI Governance Taxonomy (UAGT) - 5 analytical layers, 8 governance domains"
  doi: ""  # add the preprint/paper DOI once available

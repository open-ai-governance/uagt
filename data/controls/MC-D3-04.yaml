id: MC-D3-04
title: Privacy and personal data protection
domain: d3-data-governance-quality
objective: >
  Identify and manage privacy risks and protect personal data used by AI systems, in
  coordination with data-protection law.
principle: "Privacy by design"
evidence:
  - "privacy risk assessment"
  - "DPIA reference"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.4.3"
    label: "Data resources"
    relationship: partial
    confidence: low
    rationale: >
      ISO manages data resources but defers privacy-specific controls to ISO/IEC 27701 and
      external regimes.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MEASURE-2.10"
    label: "Privacy risk examined and documented"
    relationship: full
    confidence: medium
    rationale: >
      MEASURE 2.10 requires privacy risk to be examined and documented.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.4a"
    label: "Processing of special categories of personal data for bias detection and correction"
    relationship: partial
    confidence: medium
    rationale: >
      Art.4a (inserted by Reg. (EU) 2026/1744, replacing deleted Art.10(5)) conditions
      special-category processing for bias detection with safeguards: pseudonymisation, access
      controls, no onward transfer, deletion, and records of necessity. Broader privacy duties
      sit in the GDPR.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: "A.5.34"
    label: "Privacy and protection of PII"
    relationship: partial
    confidence: medium
    rationale: >
      A.5.34 requires privacy and protection of personally identifiable information; deeper
      privacy controls live in ISO/IEC 27701.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "P"
    label: "Privacy category (P1-P8)"
    relationship: partial
    confidence: medium
    rationale: >
      SOC 2's Privacy category (P-series) addresses notice, choice, collection, use,
      retention, and disposal of personal information; applies when Privacy is in the audit
      scope, hence partial.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "APO14"
    label: "Managed data (privacy handling)"
    relationship: partial
    confidence: medium
    rationale: >
      APO14 with MEA03 (external compliance) addresses data privacy handling; broader
      privacy obligations sit outside COBIT.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: "Clause 7"
    label: "PIMS-specific guidance for PII controllers"
    relationship: superset
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy information management system that comprehensively governs
      PII collection, processing, principals' rights, and sharing - broader than this single
      privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      The Act does not regulate personal data. That falls to Korea's Personal Information
      Protection Act, which is outside this framework's scope.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: "C.R.S. 6-1-1705(1)(a)(I)"
    label: "Request and correction of personal data used in a decision"
    relationship: partial
    confidence: medium
    rationale: >
      After an adverse outcome the deployer must, on request, give instructions for
      obtaining the personal data used and correcting factually incorrect or materially
      inaccurate personal data, consistent with 6-1-1306. The adverse-outcome disclosure
      must also give a process to request details of the ADMT and the types, categories and
      sources of personal data used, to the extent the deployer has them from the developer
      (6-1-1704(3)(b)). Wider privacy duties sit outside this framework.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: "GenAI Art.11 para.1"
    label: "Protecting user inputs and usage records"
    relationship: partial
    confidence: medium
    rationale: >
      GenAI Art.11 para.1 requires providers to protect users' inputs and usage records, collect
      no unnecessary personal information, and not unlawfully share them or retain identifying
      ones. No privacy-risk assessment duty: where personal information is involved, GenAI Art.9
      para.1 makes the provider its handler, with wider duties under personal-information law,
      outside this framework. See also GenAI Art.7(3) (training data); GenAI Art.11 para.2
      (individuals' requests).
    reviewer: "PENDING REVIEW"

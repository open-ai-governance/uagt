id: MC-D4-01
title: Transparency and information to deployers and users
domain: d4-transparency-documentation
objective: >
  Provide deployers and users with clear information enabling appropriate interpretation and
  use of an AI system's outputs.
principle: "Transparency to those affected"
evidence:
  - "instructions for use"
  - "model card"
  - "user-facing disclosures"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.8.2"
    label: "System documentation and information for users"
    relationship: full
    confidence: high
    rationale: >
      A.8.2 requires system documentation and information for users.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MEASURE-2.8"
    label: "Transparency and accountability risks examined"
    relationship: full
    confidence: medium
    rationale: >
      MEASURE 2.8 with 2.9 examines transparency and explainability.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.13"
    label: "Transparency and provision of information to deployers"
    relationship: full
    confidence: high
    rationale: >
      Art.13 requires transparency and instructions for use for deployers.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27001 has no control for transparency or provision of information to deployers
      and users of an AI system.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "CC2.3"
    label: "Communicates with external parties"
    relationship: partial
    confidence: low
    rationale: >
      CC2.3 covers external communication of objectives and responsibilities; it partially
      supports providing information to deployers but not AI-output transparency.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "APO09"
    label: "Managed service agreements"
    relationship: partial
    confidence: low
    rationale: >
      APO09 defines service agreements and information provided to service consumers;
      partially relevant to information for deployers.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: "7.3.2"
    label: "Determining information for PII principals"
    relationship: partial
    confidence: medium
    rationale: >
      Clause 7.3.2-7.3.3 require providing information to PII principals; a privacy-scoped
      form of transparency.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Art.34(1)(2)"
    label: "Explanation plan for outputs and key criteria"
    relationship: partial
    confidence: medium
    rationale: >
      Art.34(1)(2) requires a plan to explain final outputs, their key criteria and the
      training data, where technically feasible. Art.31(1) adds advance notice that a service
      is AI-based. Scope is limited to high-impact and generative AI.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: "C.R.S. 6-1-1702(1)"
    label: "Developer documentation for deployers"
    relationship: partial
    confidence: medium
    rationale: >
      6-1-1702(1) requires developers to give deployers the intended and known harmful uses,
      training-data categories, known limitations and risks, and instructions for
      appropriate use, monitoring and meaningful human review. This is documentation for
      deployers only; consumer-facing transparency is the separate entry below. Scope is
      limited to covered ADMT in consequential decisions.
    reviewer: "PENDING REVIEW"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: "C.R.S. 6-1-1704(1), (3)"
    label: "Consumer notice and post-adverse-outcome explanation"
    relationship: partial
    confidence: medium
    rationale: >
      Consumers get notice before covered ADMT is used and, after an adverse outcome, a
      plain-language account of the decision and the ADMT's role within 30 days, with a
      process to request more information (6-1-1704(1), (3)). This explains the decision,
      not the system's general operation. Scope is limited to covered ADMT in consequential
      decisions.
    reviewer: "PENDING REVIEW"

id: MC-D1-01
title: AI policy and governance framework
domain: d1-accountability-governance
objective: >
  Establish, approve, and maintain an organizational AI policy and governance framework
  setting direction and accountability for responsible AI.
principle: "Accountable, well-governed AI"
evidence:
  - "AI policy document"
  - "Statement of Applicability"
  - "management review minutes"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.2.2"
    label: "AI policy"
    relationship: full
    confidence: high
    rationale: >
      Annex A.2.2 with clause 5.2 establishes a leadership-approved AI policy.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "GOVERN-1.4"
    label: "Risk-management process via transparent policies"
    relationship: full
    confidence: medium
    rationale: >
      GOVERN 1.4 establishes the risk-management process through transparent organizational
      policies and controls.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.17"
    label: "Quality management system"
    relationship: partial
    confidence: medium
    rationale: >
      Art.17 requires a QMS including a compliance strategy and written policies; broader
      than a single AI policy.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: "A.5.1"
    label: "Policies for information security"
    relationship: partial
    confidence: medium
    rationale: >
      ISO/IEC 27001 A.5.1 establishes information-security policies; the same management-
      system pattern underpins an AI policy, though the governed subject differs.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "CC5.3"
    label: "Deploys control activities through policies and procedures"
    relationship: partial
    confidence: medium
    rationale: >
      SOC 2 CC5.3 deploys controls through policies and procedures; it establishes the
      policy mechanism but is not an AI-specific policy.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "APO01"
    label: "Managed I&T management framework"
    relationship: full
    confidence: medium
    rationale: >
      APO01 establishes the I&T management framework including policies and governance
      structures.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Art.28"
    label: "Private autonomous AI ethics committees"
    relationship: partial
    confidence: low
    rationale: >
      Art.28 lets operators set up an AI ethics committee overseeing compliance, safety,
      human-rights research and staff ethics training. It is optional ("may") and the Act
      mandates no organizational AI policy.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      The Act imposes no organisational AI policy or governance-framework duty; its
      obligations are documentation, records, consumer notice and consumer rights (6-1-1702
      to 6-1-1705). SB24-205, which this law repealed and replaced, required deployers to
      implement a risk management policy and program (former 6-1-1703(2)). That duty was not
      carried over.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      The three instruments impose no organisational AI policy or governance-framework duty.
      GenAI Art.9 para.1 assigns legal responsibility and GenAI Art.8 requires data-annotation
      rules, but neither is an AI policy. The AI ethics review measures (not mapped) require an
      AI ethics committee where research involves ethics-sensitive fields (Art.9, applying the
      2023 S&T Ethics Review Measures Art.4). In-scope activities must go to the unit's
      committee or, where the unit has none or its committee is not competent, to a service
      centre the unit has entrusted (Art.12; centres are set up under Art.11).
    reviewer: "PENDING REVIEW"

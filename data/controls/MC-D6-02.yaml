id: MC-D6-02
title: Robustness and safety
domain: d6-robustness-accuracy-security
objective: >
  Ensure AI systems remain robust and safe against errors, faults, drift, and adversarial
  conditions over their lifecycle.
principle: "Safe under stress and drift"
evidence:
  - "robustness test results"
  - "safety case"
  - "drift monitoring config"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.6.2.6"
    label: "AI system operation and monitoring"
    relationship: partial
    confidence: medium
    rationale: >
      A.6.2.6 supports detecting degradation; robustness is not a discrete Annex A control.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MEASURE-2.6"
    label: "Safety risks evaluated; safe-fail demonstrated"
    relationship: full
    confidence: high
    rationale: >
      MEASURE 2.6 evaluates safety risks and demonstrates safe failure behaviour.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.15"
    label: "Accuracy, robustness and cybersecurity"
    relationship: full
    confidence: high
    rationale: >
      Art.15 binds robustness, including to errors and adversarial conditions.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      Model-level robustness and safety have no direct ISO/IEC 27001 equivalent; its
      resilience controls address availability of information services.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      Model-level robustness and safety have no direct SOC 2 equivalent; availability
      controls address service uptime, not model behaviour.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "BAI04"
    label: "Managed availability and capacity"
    relationship: partial
    confidence: low
    rationale: >
      BAI04 (with DSS04 continuity) addresses availability and resilience; partially
      relevant to robustness, not model safety.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Art.32(1)"
    label: "Safety obligations for high-compute AI"
    relationship: partial
    confidence: medium
    rationale: >
      Art.32(1) requires lifecycle risk identification, assessment and mitigation, plus a
      safety-incident risk system, but only for systems above the compute threshold in
      Enforcement Decree Art.24 (10^26 FLOPs plus further criteria).
    reviewer: "PENDING REVIEW"

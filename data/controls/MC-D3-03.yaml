id: MC-D3-03
title: Data representativeness and bias examination
domain: d3-data-governance-quality
objective: >
  Ensure datasets are relevant and representative and that data-side bias is examined and
  mitigated.
principle: "Fairness; non-discrimination"
evidence:
  - "bias evaluation report"
  - "representativeness analysis"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.7.4"
    label: "Quality of data for AI systems"
    relationship: partial
    confidence: medium
    rationale: >
      ISO addresses data quality; representativeness/bias is examined via quality, not a
      dedicated control.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MEASURE-2.11"
    label: "Fairness and bias evaluated and documented"
    relationship: full
    confidence: high
    rationale: >
      MEASURE 2.11 evaluates fairness and harmful bias.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.10"
    label: "Data and data governance"
    relationship: full
    confidence: high
    rationale: >
      Art.10 requires examination of datasets in view of possible biases.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.4a"
    label: "Processing of special categories of personal data for bias detection and correction"
    relationship: partial
    confidence: medium
    rationale: >
      Art.4a (inserted by Reg. (EU) 2026/1744) provides the legal basis to process
      special-category data where strictly necessary for bias detection and correction: for
      high-risk providers under Art.10(2)(f)-(g), and via Art.4a(2) for other AI systems and
      models and high-risk deployers. An enabling condition for bias examination, not the
      examination duty itself.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      Representativeness and bias examination have no ISO/IEC 27001 equivalent.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      Representativeness and bias examination have no SOC 2 equivalent.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      COBIT 2019 has no representativeness or bias-examination objective.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      There is no explicit bias or representativeness duty. Bias is reached only indirectly
      through the fundamental-rights impact assessment (Art.35, best-efforts).
    reviewer: "PENDING REVIEW"

id: MC-D7-02
title: Incident reporting and corrective action
domain: d7-lifecycle-monitoring
objective: >
  Detect, report, and correct serious incidents and malfunctions of AI systems, internally
  and to relevant parties.
principle: "Detect, report, and fix harms"
evidence:
  - "incident register"
  - "serious-incident reports"
  - "corrective-action records"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.8.4"
    label: "Communication of incidents"
    relationship: full
    confidence: high
    rationale: >
      A.8.4 with clause 10.2 covers incident communication and corrective action.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MANAGE-4.3"
    label: "Incidents communicated; recovery documented"
    relationship: full
    confidence: high
    rationale: >
      MANAGE 4.3 requires incidents and errors communicated with tracking and recovery.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.73"
    label: "Reporting of serious incidents"
    relationship: full
    confidence: high
    rationale: >
      Art.73 requires providers to report serious incidents to authorities.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: "A.5.24"
    label: "Information security incident management planning and preparation"
    relationship: full
    confidence: high
    rationale: >
      A.5.24 with A.5.25-A.5.26 establishes incident management planning, assessment, and
      response - a strong match for incident reporting and corrective action.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "CC7.4"
    label: "Responds to identified security incidents"
    relationship: full
    confidence: medium
    rationale: >
      CC7.3-CC7.5 establish incident evaluation, response, and recovery - a strong match for
      incident reporting and corrective action.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "DSS02"
    label: "Managed service requests and incidents"
    relationship: full
    confidence: medium
    rationale: >
      DSS02 (with DSS03 problems) establishes incident management - a strong match for
      incident reporting and corrective action.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Art.32(2)"
    label: "Submission of safety implementation results"
    relationship: partial
    confidence: low
    rationale: >
      Art.32(2) requires submitting implementation results to MSIT, and Art.40(3) lets MSIT
      order suspension or correction. There is no general serious-incident reporting duty.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      There is no incident-reporting duty. SB24-205 required developers and deployers to
      tell the attorney general within 90 days of discovering algorithmic discrimination
      (former 6-1-1702(5), 6-1-1703(7)); SB26-189 dropped this. The attorney general's
      annual report under 6-1-1706(3)(e) concerns enforcement, not incidents.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: "GenAI Art.14 para.1"
    label: "Unlawful content: stop, rectify and report"
    relationship: partial
    confidence: medium
    rationale: >
      GenAI Art.14 para.1 requires providers that find unlawful content to stop and remove it,
      rectify the model and report to the authorities. Limited to unlawful content, not
      malfunctions or serious incidents generally. See also GenAI Art.14 para.2 (handling and
      reporting unlawful use by users).
    reviewer: "PENDING REVIEW"

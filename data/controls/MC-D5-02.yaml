id: MC-D5-02
title: Operator competence and human-AI configuration
domain: d5-human-oversight
objective: >
  Configure human-AI interaction and ensure operators are competent to oversee the system in
  its intended context.
principle: "Competent, well-configured oversight"
evidence:
  - "operator competence records"
  - "human-AI interaction design"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.9.4"
    label: "Intended use of the AI system"
    relationship: partial
    confidence: medium
    rationale: >
      A.9.4 with A.9.2 constrains use to intended purpose; operator competence is implied.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "MAP-3.5"
    label: "Human-oversight processes defined and assessed"
    relationship: full
    confidence: medium
    rationale: >
      MAP 3.5 with 3.4 defines and assesses human-oversight processes and operator
      proficiency.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.26"
    label: "Obligations of deployers of high-risk AI systems"
    relationship: full
    confidence: medium
    rationale: >
      Art.26 requires deployers to assign competent human oversight and use per
      instructions.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: "7.2"
    label: "Competence"
    relationship: partial
    confidence: low
    rationale: >
      Clause 7.2 requires competence of personnel; it partially supports operator competence
      but does not address human-AI configuration or oversight.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "CC1.4"
    label: "Commitment to competence"
    relationship: partial
    confidence: low
    rationale: >
      CC1.4 supports operator competence generally but does not address human-AI
      configuration or oversight.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "APO07"
    label: "Managed human resources"
    relationship: partial
    confidence: low
    rationale: >
      APO07 manages competence of personnel; not specific to human-AI configuration or
      oversight.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      The Act does not address operator competence or configuring the human-AI interface.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: "C.R.S. 6-1-1701(15)"
    label: "Qualifications for meaningful human review"
    relationship: partial
    confidence: medium
    rationale: >
      Meaningful human review requires a trained reviewer who considers the available
      primary evidence, does not default to the system output, and has enough information to
      understand the output's intended use, limitations, inputs and principal factors.
      Developers must supply instructions for human review (6-1-1702(1)(d)). It covers only
      review of adverse decisions on request, not operators generally.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: null
    label: null
    relationship: none
    confidence: medium
    rationale: >
      The three instruments do not address operator competence or configuring the human-AI
      interface. GenAI Art.10 requires providers to guide users and to prevent minors'
      over-reliance on or addiction to the service, which concerns end users, not operators
      overseeing the system.
    reviewer: "PENDING REVIEW"

id: MC-D8-01
title: Third-party and supplier governance
domain: d8-value-chain-gpai
objective: >
  Govern AI-related risks introduced by suppliers and third-party components across the
  value chain.
principle: "Accountability across the supply chain"
evidence:
  - "supplier due-diligence records"
  - "third-party contracts/DPAs"
  - "component risk assessments"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: "A.10.3"
    label: "Suppliers"
    relationship: full
    confidence: high
    rationale: >
      A.10.3 with A.10.2 governs supplier relationships and allocation of responsibilities.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: "GOVERN-6.1"
    label: "Policies address third-party risks"
    relationship: full
    confidence: high
    rationale: >
      GOVERN 6.1 with MANAGE 3.1 addresses third-party AI risks and applies controls.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.25"
    label: "Responsibilities along the AI value chain"
    relationship: full
    confidence: medium
    rationale: >
      Art.25 allocates responsibilities along the AI value chain.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: "A.5.19"
    label: "Information security in supplier relationships"
    relationship: full
    confidence: high
    rationale: >
      A.5.19 governs information security in supplier relationships, directly matching
      third-party and supplier governance.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: "CC9.2"
    label: "Assesses and manages vendor and business partner risks"
    relationship: full
    confidence: high
    rationale: >
      CC9.2 directly governs vendor and business-partner risk - a strong match for third-
      party and supplier governance.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: "APO10"
    label: "Managed vendors"
    relationship: full
    confidence: high
    rationale: >
      APO10 governs vendor selection, relationships, and risk - a strong match for third-
      party and supplier governance.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Decree Art.27"
    label: "Deployer information requests to developers"
    relationship: partial
    confidence: low
    rationale: >
      Enforcement Decree Art.27 lets a deployer that does not substantially modify a system
      rely on the developer's Art.34(1)(1)-(3) compliance and request information from it.
      This is a light value-chain allocation, not supplier governance.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: "C.R.S. 6-1-1707"
    label: "Developer-deployer fault allocation; indemnities void"
    relationship: partial
    confidence: low
    rationale: >
      6-1-1707 allocates fault between developers and deployers by relative fault, limits
      developer liability to intended or contracted uses, and voids contract terms that
      indemnify a party for its own discriminatory acts. With the developer-to-deployer
      information duties in 6-1-1702 this is a value-chain allocation, not a
      supplier-governance process.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: "GenAI Art.7(1)"
    label: "Lawful-source foundation models and data"
    relationship: partial
    confidence: low
    rationale: >
      GenAI Art.7(1) requires providers to use data and foundation models with lawful
      sources, which reaches third-party components. There is no wider
      supplier-governance duty. Judgement call: partial rather than none.
    reviewer: "PENDING REVIEW"

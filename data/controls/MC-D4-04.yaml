id: MC-D4-04
title: Disclosure of AI-generated and synthetic content
domain: d4-transparency-documentation
objective: >
  Ensure AI-generated or manipulated content is marked and disclosed so recipients can
  recognize it as artificial.
principle: "Honest signalling of artificial content"
evidence:
  - "content marking/watermark records"
  - "deployer disclosure notices"
mappings:
  - framework: ISO-IEC-42001
    version: "2023"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 42001 contains no control specific to labelling AI-generated or synthetic
      content; no clean equivalent.
    reviewer: "Vinod Dhiman"
  - framework: NIST-AI-RMF
    version: "1.0"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      The NIST AI RMF does not prescribe synthetic-content disclosure or marking.
    reviewer: "Vinod Dhiman"
  - framework: EU-AI-ACT
    version: "2024/1689 am. 2026/1744"
    ref: "Art.50"
    label: "Transparency obligations for certain AI systems"
    relationship: full
    confidence: high
    rationale: >
      Art.50 imposes marking/disclosure duties for synthetic media and certain interactions.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27001
    version: "2022/Amd 1:2024"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27001 has no control for marking or disclosing AI-generated or synthetic
      content.
    reviewer: "Vinod Dhiman"
  - framework: SOC-2
    version: "2017"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      SOC 2 has no control for marking or disclosing AI-generated or synthetic content.
    reviewer: "Vinod Dhiman"
  - framework: COBIT-2019
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      COBIT 2019 has no control for AI-generated or synthetic content disclosure.
    reviewer: "Vinod Dhiman"
  - framework: ISO-IEC-27701
    version: "2019"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      ISO/IEC 27701 is a privacy (PII) management extension to ISO/IEC 27001; it has no
      equivalent for this non-privacy control.
    reviewer: "Vinod Dhiman"
  - framework: KR-AI-BASIC-ACT
    version: "Act No. 20676 am. 21311"
    ref: "Art.31(2)-(3)"
    label: "Labelling of generative AI outputs and deepfakes"
    relationship: full
    confidence: high
    rationale: >
      Art.31(2) requires generative-AI outputs to be labelled as generated. Art.31(3) requires
      clear notice or labelling of realistic synthetic audio, images or video (with lighter
      handling for artistic works). Methods are set by Enforcement Decree Art.23.
    reviewer: "Vinod Dhiman"
  - framework: US-CO-ADMT
    version: "SB26-189 (Sess. Laws 2026, ch. 131)"
    ref: null
    label: null
    relationship: none
    confidence: high
    rationale: >
      The Act has no labelling or disclosure duty for AI-generated or synthetic content. Its
      notices disclose that ADMT was used in a decision, not that content is artificial.
      Chatbots are regulated separately by HB26-1263, which is not part of this framework.
    reviewer: "PENDING REVIEW"
  - framework: CN-GENAI
    version: "Interim Measures 2023 + Labeling Measures 2025 + GB 45438-2025"
    ref: "Labeling Arts.4-6"
    label: "Explicit, implicit and platform labels on generated content"
    relationship: full
    confidence: medium
    rationale: >
      Labeling Art.4 requires explicit labels that users can perceive, on the content or the
      interface and in exported files, where the service may confuse or mislead the public (per
      Deep Synthesis Provisions Art.17 para.1, not mapped; the list ends in a catch-all).
      Platforms must add prominent labels to content that its metadata, the uploader's
      declaration or detected traces show to be generated (Labeling Art.6), and publishing users
      must declare and label it (Labeling Art.10 para.1). Labeling Art.5 adds machine-readable
      implicit labels in the file metadata of generated content files (per Deep Synthesis
      Provisions Art.16, not mapped). Methods: GB 45438 cl.5 (explicit); GB 45438 cl.6.1 with
      Annex E (implicit). Judgement call: full because content that may mislead must carry
      visible labels and platforms must surface the marks; partial is arguable because explicit
      labels are conditional and waivable on request (Labeling Art.9).
    reviewer: "PENDING REVIEW"
